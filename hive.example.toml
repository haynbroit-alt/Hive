# Copiez ce fichier en hive.toml et adaptez-le (hive.toml est ignoré par git).
# SECRETS : jamais ici. Seulement le NOM des variables d'environnement qui les contiennent.

data_dir = "data"

[server]
host = "127.0.0.1"   # ne changez pas sans réseau privé (Tailscale). Jamais d'exposition publique.
port = 8765

[colony]
parallelism = 3       # tâches simultanées (une par abeille et par tour)
quorum = 0.5          # part du vote pondéré nécessaire (strictement au-dessus) pour un quorum
tick_s = 1.0

[policy]
budget_cap_eur = 0.0          # 0 € : aucun fournisseur payant ne sera jamais appelé
auto_execute_max = "faible"   # au-delà : votre validation (faible | modéré | élevé)
max_steps_per_mission = 60
max_llm_calls_per_mission = 80
max_mission_seconds = 3600
require_human_for_lessons = true

# --- Modèles -----------------------------------------------------------------
# « offline » est toujours présent (secours déterministe, honnête, 0 €).

[providers.local]                 # 0 €, privé : https://ollama.com (ollama pull gemma4:e4b)
type = "ollama"
model = "gemma4:e4b"              # texte + image ; vérifiez le tag exact avec `ollama list`
base_url = "http://localhost:11434"
vision = true

# [providers.local2]              # 2e modèle local = diversité réelle des votes
# type = "ollama"
# model = "ministral-3:8b"
# vision = true

# [providers.gemini]              # gratuit, quotas limités ; vos données vont chez Google (conditions EEE)
# type = "openai"
# base_url = "https://generativelanguage.googleapis.com/v1beta/openai"
# model = "gemini-3-flash"        # vérifiez le nom exact dans AI Studio
# api_key_env = "GEMINI_API_KEY"
# vision = true
# rpm = 5

# [providers.claude]              # PAYANT : bloqué tant que budget_cap_eur = 0 (pip install ".[claude]")
# type = "anthropic"
# model = "claude-opus-5-5"
# price_in = 4.0                  # prix public en USD par million de jetons (2026-11) ; à exprimer en €
# price_out = 20.0

[models]
default = ["local", "offline"]
# sceptique = ["local2", "local", "offline"]   # une critique faite par un autre modèle décorrèle les erreurs
# vision = ["local"]                           # utilisé pour décrire images et images clés

[tools]
web_domains = ["wikipedia.org"]   # lecture web autorisée uniquement sur ces domaines (HTTPS)
webhook_urls = []                 # effets externes : URL exactes autorisées (toujours sous validation)

[stt]                             # transcription vocale
# type = "faster-whisper"         # local : pip install ".[stt]"
# model = "small"
# language = "fr"

[telegram]
enabled = false
token_env = "HIVE_TELEGRAM_TOKEN" # jeton du bot (via @BotFather) dans cette variable d'environnement
allowed_chat_ids = []             # vide = mode installation : le bot vous donnera votre identifiant
