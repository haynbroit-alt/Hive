[project]
name = "hive-colony"
version = "0.1.0"
description = "HIVE — une intelligence collective d'agents IA, gouvernée par l'humain, pilotable depuis un smartphone."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# Fournisseur payant : n'est jamais appelé sans autorisation budgétaire explicite.
claude = ["anthropic>=0.70"]
# Transcription vocale locale (gratuite, hors-ligne).
stt = ["faster-whisper>=1.0"]
dev = ["pytest>=8"]

[project.scripts]
hive = "hive.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["hive*"]

[tool.setuptools.package-data]
"hive.api" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
